<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>okolo · ds-form-field — оси параметризации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Токены design-system (зеркало styles/design-system) ===== */
  :root {
    /* поверхности / стекло */
    --c-bg: #07080d;
    --c-bg-2: #0b0c13;
    --c-glass: rgba(18, 20, 32, 0.58);
    --c-glass-hi: rgba(255, 255, 255, 0.05);
    --c-glass-fill: rgba(255, 255, 255, 0.03);
    --c-line: rgba(255, 255, 255, 0.07);
    --c-line-strong: rgba(255, 255, 255, 0.18);
    /* текст */
    --c-ink: #eef0f8;
    --c-ink-dim: #9aa0b8;
    --c-ink-mute: #60657d;
    /* семантика / неон */
    --c-bad: #ff6b8a;
    --c-blue: #6cb9ff;
    --c-violet: #b48bff;
    --c-pink: #ff7bde;
    /* отступы (4px-сетка) */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    --space-16: 4rem;
    /* радиусы */
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-2xl: 24px;
    --radius-pill: 999px;
    /* тени / blur / glow */
    --shadow-glass: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
    --shadow-inset-hi: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    --blur-glass: 24px;
    --glow-primary: 0 20px 50px -10px rgba(108, 185, 255, 0.55), 0 0 0 4px rgba(108, 185, 255, 0.1);
    /* шрифт / размеры */
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Onest', system-ui, sans-serif;
    --fs-lg: 1rem;
    --fs-md: 0.875rem;
    --fs-sm: 0.8125rem;
    --fs-xs: 0.75rem;
    --fs-xl: 1.5rem;
    /* motion */
    --dur-fast: 0.2s;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --t-colors: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--c-bg);
    color: var(--c-ink);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  button, input { font-family: inherit; color: inherit; }

  /* ============================================================
     ds-form-field — зеркало form-field.component.scss
     Оси через data-атрибуты: data-size / data-appearance / data-shape
     ============================================================ */
  .ds-form-field {
    /* size = M (дефолт) */
    --ds-field-pad-y: var(--space-3);
    --ds-field-pad-x: var(--space-4);
    --ds-field-radius: var(--radius-sm);
    --ds-field-fs: var(--fs-md);
    /* appearance = outline (дефолт) */
    --ds-field-bg: var(--c-glass-fill);
    --ds-field-border-color: var(--c-line);
    --ds-field-shadow: 0 0 0 0 transparent;
    --ds-field-blur: none;
    /* акцент фокуса (тема, задаётся сверху) */
    --ds-field-accent: var(--c-blue);
    --ds-field-glow: var(--glow-primary);

    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    font-size: var(--ds-field-fs);
  }

  /* --- size --- */
  .ds-form-field[data-size="S"]  { --ds-field-pad-y: var(--space-2); --ds-field-pad-x: var(--space-3); --ds-field-radius: var(--radius-xs); --ds-field-fs: var(--fs-sm); }
  .ds-form-field[data-size="L"]  { --ds-field-pad-y: var(--space-4); --ds-field-pad-x: var(--space-5); --ds-field-radius: var(--radius-md); --ds-field-fs: var(--fs-lg); }
  .ds-form-field[data-size="XL"] { --ds-field-pad-y: var(--space-5); --ds-field-pad-x: var(--space-6); --ds-field-radius: var(--radius-md); --ds-field-fs: var(--fs-lg); }

  /* --- appearance --- */
  .ds-form-field[data-appearance="glass"]  { --ds-field-bg: var(--c-glass); --ds-field-shadow: var(--shadow-glass), var(--shadow-inset-hi); --ds-field-blur: blur(var(--blur-glass)) saturate(140%); }
  .ds-form-field[data-appearance="filled"] { --ds-field-bg: var(--c-glass-hi); --ds-field-border-color: transparent; }
  .ds-form-field[data-appearance="ghost"]  { --ds-field-bg: transparent; --ds-field-border-color: transparent; }

  /* --- shape (после size — перебивает радиус) --- */
  .ds-form-field[data-shape="pill"] { --ds-field-radius: var(--radius-pill); }

  .ds-form-field__wrapper {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--ds-field-pad-y) var(--ds-field-pad-x);
    border: 1px solid var(--ds-field-border-color);
    border-radius: var(--ds-field-radius);
    background: var(--ds-field-bg);
    box-shadow: var(--ds-field-shadow);
    backdrop-filter: var(--ds-field-blur);
    -webkit-backdrop-filter: var(--ds-field-blur);
    color: var(--c-ink);
    cursor: text;
    transition: var(--t-colors), box-shadow var(--dur-fast) var(--ease-standard);
  }
  .ds-form-field__wrapper:focus-within {
    border-color: var(--ds-field-accent);
    box-shadow: var(--ds-field-shadow), var(--ds-field-glow);
  }
  .ds-form-field__prefix,
  .ds-form-field__suffix { display: flex; flex-shrink: 0; align-items: center; color: var(--c-ink-dim); }

  .ds-input {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
  }
  .ds-input::placeholder { color: var(--c-ink-mute); }

  .ds-form-field__hint { font-size: var(--fs-xs); color: var(--c-ink-mute); }
  .ds-form-field__hint--error { color: var(--c-bad); }

  /* ===== Раскладка демо ===== */
  .demo { max-width: 1100px; margin: 0 auto; padding: var(--space-10) var(--space-6) var(--space-16); }
  .demo__title { margin: 0 0 var(--space-8); font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); }
  .demo__section { margin-bottom: var(--space-12); }
  .demo__h2 { margin: 0 0 var(--space-5); font-size: var(--fs-lg); font-weight: 600; }
  .demo__muted { color: var(--c-ink-mute); font-weight: 400; }
  .demo__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6); }
  .demo__grid--backdrop {
    padding: var(--space-8);
    border-radius: var(--radius-2xl);
    background:
      radial-gradient(600px 320px at 12% 8%, rgba(108, 185, 255, 0.22), transparent 60%),
      radial-gradient(540px 300px at 88% 22%, rgba(180, 139, 255, 0.20), transparent 60%),
      radial-gradient(520px 320px at 50% 100%, rgba(255, 123, 222, 0.16), transparent 62%),
      var(--c-bg-2);
  }
  .demo__cell { display: flex; flex-direction: column; gap: var(--space-3); }
  .demo__row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-6); }
  .demo__row .ds-form-field { flex: 1 1 220px; }
  .demo__tag { font-size: var(--fs-xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--c-ink-dim); }
  .demo__label { font-size: var(--fs-xs); color: var(--c-ink-mute); }
  .demo__kbd {
    font-size: 11px; letter-spacing: 0.08em;
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-xs);
    background: var(--c-glass-fill);
    border: 1px solid var(--c-line);
    color: var(--c-ink-mute);
  }
</style>
</head>
<body>
  <div class="demo">
    <h1 class="demo__title">ds-form-field — оси параметризации</h1>

    <!-- ====== МАТРИЦА appearance × shape ====== -->
    <section class="demo__section">
      <h2 class="demo__h2">appearance × shape <span class="demo__muted">(size M)</span></h2>

      <div class="demo__grid demo__grid--backdrop" id="matrix"></div>
    </section>

    <!-- ====== РАЗМЕРЫ ====== -->
    <section class="demo__section">
      <h2 class="demo__h2">size <span class="demo__muted">(appearance outline · box)</span></h2>
      <div class="demo__row" id="sizes"></div>
    </section>

    <!-- ====== СОСТОЯНИЯ ====== -->
    <section class="demo__section">
      <h2 class="demo__h2">состояния</h2>
      <div class="demo__row">
        <div class="ds-form-field">
          <span class="demo__label">С подсказкой</span>
          <div class="ds-form-field__wrapper"><input class="ds-input" type="text" placeholder="введите имя"></div>
          <div class="ds-form-field__hint">Так вас увидят в карточке сервиса</div>
        </div>
        <div class="ds-form-field">
          <span class="demo__label">С ошибкой</span>
          <div class="ds-form-field__wrapper"><input class="ds-input" type="text" placeholder="введите имя"></div>
          <div class="ds-form-field__hint ds-form-field__hint--error">Поле обязательно</div>
        </div>
        <div class="ds-form-field">
          <span class="demo__label">Акцент сверху (--ds-field-accent: violet)</span>
          <div class="ds-form-field__wrapper" style="--ds-field-accent: var(--c-violet); --ds-field-glow: 0 20px 50px -10px rgba(180,139,255,.55), 0 0 0 4px rgba(180,139,255,.1);">
            <input class="ds-input" type="text" placeholder="фокус — фиолетовый">
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Иконка-лупа (prefix)
    const LENS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

    const field = (attrs, { prefix = false, suffix = false, placeholder = '' } = {}) => `
      <div class="ds-form-field" ${attrs}>
        <div class="ds-form-field__wrapper">
          ${prefix ? `<span class="ds-form-field__prefix" aria-hidden="true">${LENS}</span>` : ''}
          <input class="ds-input" type="text" placeholder="${placeholder}">
          ${suffix ? `<span class="ds-form-field__suffix"><span class="demo__kbd">⌘K</span></span>` : ''}
        </div>
      </div>`;

    const appearances = ['outline', 'glass', 'filled', 'ghost'];
    const shapes = ['box', 'pill'];

    document.getElementById('matrix').innerHTML = appearances.flatMap((a) =>
      shapes.map((s) => `
        <div class="demo__cell">
          <span class="demo__tag">${a} · ${s}</span>
          ${field(`data-appearance="${a}" data-shape="${s}"`, { placeholder: 'Найти сервис рядом…' })}
          ${field(`data-appearance="${a}" data-shape="${s}"`, { prefix: true, suffix: true, placeholder: 'С иконкой и suffix' })}
        </div>`)
    ).join('');

    document.getElementById('sizes').innerHTML = ['S', 'M', 'L', 'XL'].map((s) => `
      <div class="ds-form-field" data-size="${s}">
        <span class="demo__label">Размер ${s}</span>
        <div class="ds-form-field__wrapper"><input class="ds-input" type="text" placeholder="${s}"></div>
      </div>`).join('');
  </script>
</body>
</html>
